<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent One Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 28px;
            color: #333;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #4caf50;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .card h2 {
            font-size: 14px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .card-value {
            font-size: 36px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }

        .card-subtext {
            font-size: 12px;
            color: #999;
        }

        .card.warning .card-value {
            color: #ff9800;
        }

        .card.error .card-value {
            color: #f44336;
        }

        .card.success .card-value {
            color: #4caf50;
        }

        .section {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .section h3 {
            font-size: 20px;
            color: #333;
            margin-bottom: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .job-item {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #667eea;
        }

        .job-info h4 {
            font-size: 14px;
            color: #333;
            margin-bottom: 5px;
        }

        .job-info p {
            font-size: 12px;
            color: #999;
        }

        .job-progress {
            flex: 1;
            margin: 0 20px;
        }

        .progress-bar {
            background: #e0e0e0;
            height: 4px;
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 5px;
        }

        .progress-fill {
            background: #667eea;
            height: 100%;
            width: 45%;
            transition: width 0.3s;
        }

        .progress-text {
            font-size: 11px;
            color: #999;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-processing {
            background: #e3f2fd;
            color: #1976d2;
        }

        .status-completed {
            background: #e8f5e9;
            color: #388e3c;
        }

        .status-error {
            background: #ffebee;
            color: #d32f2f;
        }

        .logs-container {
            background: #1e1e1e;
            color: #00ff00;
            padding: 15px;
            border-radius: 5px;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 12px;
            max-height: 400px;
            overflow-y: auto;
            line-height: 1.5;
        }

        .log-line {
            margin-bottom: 5px;
        }

        .log-timestamp {
            color: #888;
        }

        .log-level-info {
            color: #00ff00;
        }

        .log-level-warning {
            color: #ffaa00;
        }

        .log-level-error {
            color: #ff4444;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .empty-state p {
            margin: 10px 0;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 20px;
            }

            .nav-buttons {
                flex-wrap: wrap;
            }

            .job-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .job-progress {
                width: 100%;
                margin: 10px 0;
            }
        }

        .refresh-info {
            text-align: right;
            font-size: 12px;
            color: #999;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>
                <span class="status-indicator"></span>
                Agent One Dashboard
            </h1>
            <div class="nav-buttons">
                <button class="btn-secondary" onclick="location.href='/jobs'">Jobs History</button>
                <button class="btn-secondary" onclick="location.href='/logs'">Logs</button>
                <button class="btn-secondary" onclick="location.href='/settings'">Settings</button>
                <button class="btn-primary" onclick="restartAgent()">Restart Agent</button>
            </div>
        </header>

        <div class="grid" id="stats-grid"></div>

        <div class="section">
            <h3>📹 Currently Processing</h3>
            <div id="current-jobs"></div>
        </div>

        <div class="section">
            <h3>✅ Recently Completed</h3>
            <div id="completed-videos"></div>
        </div>

        <div class="section">
            <h3>📊 Recent Logs</h3>
            <div class="logs-container" id="logs-container"></div>
        </div>

        <div class="refresh-info">
            Auto-refreshing every 10 seconds... <span id="last-update"></span>
        </div>
    </div>

    <script>
        const API_BASE = '/api';

        async function loadDashboard() {
            try {
                // Load stats
                const statsRes = await fetch(`${API_BASE}/stats`);
                const stats = await statsRes.json();
                renderStats(stats);

                // Load current jobs
                const jobsRes = await fetch(`${API_BASE}/current-jobs`);
                const jobs = await jobsRes.json();
                renderCurrentJobs(jobs.jobs);

                // Load completed videos
                const completedRes = await fetch(`${API_BASE}/completed-videos?days=7`);
                const completed = await completedRes.json();
                renderCompletedVideos(completed.videos);

                // Load logs
                const logsRes = await fetch(`${API_BASE}/logs?lines=50`);
                const logs = await logsRes.json();
                renderLogs(logs.logs);

                // Update timestamp
                document.getElementById('last-update').textContent =
                    `Last updated: ${new Date().toLocaleTimeString()}`;
            } catch (error) {
                console.error('Failed to load dashboard:', error);
            }
        }

        function renderStats(stats) {
            const grid = document.getElementById('stats-grid');
            grid.innerHTML = `
                <div class="card success">
                    <h2>Processing Now</h2>
                    <div class="card-value">${stats.current_processing}</div>
                    <div class="card-subtext">videos in queue</div>
                </div>
                <div class="card">
                    <h2>Completed Today</h2>
                    <div class="card-value">${stats.completed_today}</div>
                    <div class="card-subtext">videos processed</div>
                </div>
                <div class="card">
                    <h2>Total Processed</h2>
                    <div class="card-value">${stats.total_completed}</div>
                    <div class="card-subtext">all time</div>
                </div>
                <div class="card">
                    <h2>Storage Used</h2>
                    <div class="card-value">${stats.storage_used}</div>
                    <div class="card-subtext">temporary files</div>
                </div>
                <div class="card">
                    <h2>Next Check</h2>
                    <div class="card-value">${stats.next_check}</div>
                    <div class="card-subtext">in 30 minutes</div>
                </div>
                <div class="card">
                    <h2>Agent Status</h2>
                    <div class="card-value">✓ Running</div>
                    <div class="card-subtext">All systems operational</div>
                </div>
            `;
        }

        function renderCurrentJobs(jobs) {
            const container = document.getElementById('current-jobs');
            if (jobs.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>No videos currently processing</p></div>';
                return;
            }

            container.innerHTML = jobs.map(job => `
                <div class="job-item">
                    <div class="job-info">
                        <h4>${job.video_name}</h4>
                        <p>Started: ${new Date(job.started_at).toLocaleString()}</p>
                    </div>
                    <div class="job-progress">
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${job.metadata?.progress || 45}%"></div>
                        </div>
                        <div class="progress-text">${job.metadata?.step || 'Processing'}...</div>
                    </div>
                    <span class="status-badge status-processing">${job.status}</span>
                </div>
            `).join('');
        }

        function renderCompletedVideos(videos) {
            const container = document.getElementById('completed-videos');
            if (videos.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>No videos completed recently</p></div>';
                return;
            }

            container.innerHTML = videos.map(video => `
                <div class="job-item">
                    <div class="job-info">
                        <h4>${video.name}</h4>
                        <p>Completed: ${new Date(video.completed_at).toLocaleString()}</p>
                    </div>
                    <div>
                        <p style="font-size: 12px; color: #666; margin-bottom: 5px;">Platforms:</p>
                        ${video.platforms.map(p => `<span class="status-badge status-completed">${p}</span>`).join(' ')}
                    </div>
                </div>
            `).join('');
        }

        function renderLogs(logs) {
            const container = document.getElementById('logs-container');
            if (logs.length === 0) {
                container.innerHTML = '<div class="log-line">No logs available</div>';
                return;
            }

            container.innerHTML = logs.map(line => {
                let levelClass = 'log-level-info';
                if (line.includes('ERROR') || line.includes('❌')) levelClass = 'log-level-error';
                else if (line.includes('WARNING') || line.includes('⚠️')) levelClass = 'log-level-warning';

                const match = line.match(/\[(.*?)\]/);
                const timestamp = match ? `<span class="log-timestamp">[${match[1]}]</span>` : '';
                const message = line.replace(/\[.*?\]/, '').trim();

                return `<div class="log-line">${timestamp} <span class="${levelClass}">${message}</span></div>`;
            }).join('');

            container.scrollTop = container.scrollHeight;
        }

        async function restartAgent() {
            if (!confirm('Are you sure you want to restart the agent?')) return;

            try {
                const res = await fetch(`${API_BASE}/restart`);
                const result = await res.json();
                alert(result.message);
                setTimeout(loadDashboard, 2000);
            } catch (error) {
                alert('Failed to restart agent: ' + error.message);
            }
        }

        // Auto-refresh every 10 seconds
        setInterval(loadDashboard, 10000);

        // Initial load
        loadDashboard();
    </script>
</body>
</html>
