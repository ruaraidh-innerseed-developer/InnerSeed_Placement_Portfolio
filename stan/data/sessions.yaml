# The STAN programme — seminars and groups.
#
# STATUS: every entry is `illustrative: true`. None of this exists yet. They are
# here so the shape can be judged and the filtering built. Nothing loses its
# illustrative flag until SUPPORT-MODEL.md §10 is met — trained facilitators,
# crisis protocol, insurance, clinical escalation, two facilitators per group.
#
# Two different things, deliberately separated:
#
#   SEMINARS — someone who knows something talks, then answers questions.
#              Recorded where possible. Lowest-risk thing STAN can run, and the
#              best demonstration of quality to a prospective clinical partner.
#
#   GROUPS   — people in the same situation, in a room, with someone holding it.
#              Higher risk, more governance, more value.

countries:
  - {id: all,      label: "Anywhere — show me everything"}
  - {id: scotland, label: Scotland}
  - {id: england,  label: England}
  - {id: wales,    label: Wales}
  - {id: ni,       label: Northern Ireland}
  - {id: ireland,  label: Republic of Ireland}
  - {id: other,    label: Outside UK & Ireland}

kinds:
  - {id: all,    label: Any kind}
  - {id: open,   label: Open group — drop in}
  - {id: cohort, label: Closed cohort — same people each week}
  - {id: family, label: Partners & family}
  - {id: topic,  label: Topic group}

# ---------------------------------------------------------------- seminars

seminars:

  - id: what-happens-when-you-stop
    title: What actually happens when you stop
    speaker:
      name: "[Clinician — not yet recruited]"
      role: Consultant in reproductive endocrinology
      org: "[Institution]"
    when: Thu 18 Sep
    time: "19:30"
    duration: 45 min + questions
    format: live-with-qa
    recording: will-be-recorded
    audience: Anyone considering stopping, or recently stopped
    summary: >-
      What the research actually shows about recovery after long-term use, what
      it does not show, and why the honest answer to "how long" is harder than
      anyone wants it to be.
    illustrative: true

  - id: reading-your-own-bloods
    title: Reading your own bloods without panicking
    speaker:
      name: "[Specialist — not yet recruited]"
      role: Clinical biochemist
      org: "[Institution]"
    when: Thu 16 Oct
    time: "19:30"
    duration: 40 min + questions
    format: live-with-qa
    recording: will-be-recorded
    audience: Anyone who has a panel they cannot interpret
    summary: >-
      A walk through a real hormone panel, line by line — what each marker is,
      why reference ranges differ between laboratories, and which two numbers
      together tell you more than either alone.
    illustrative: true

  - id: fertility-and-what-comes-back
    title: Fertility — what comes back, and what to ask for
    speaker:
      name: "[Andrologist — not yet recruited]"
      role: Consultant andrologist
      org: "[Fertility service]"
    when: Thu 20 Nov
    time: "19:30"
    duration: 45 min + questions
    format: live-with-qa
    recording: will-be-recorded
    audience: Anyone worried about fertility, and their partners
    summary: >-
      Why sperm production stops even at high blood levels, what assessment
      actually involves, and how to get seen by the specialty that deals with
      this most often.
    illustrative: true

  - id: women-and-peds-seminar
    title: Women and PEDs — the conversation nobody is having
    speaker:
      name: "[Speaker — not yet recruited]"
      role: To be confirmed
      org: "[Institution]"
    when: Thu 11 Dec
    time: "19:30"
    duration: 45 min + questions
    format: live-with-qa
    recording: will-be-recorded
    audience: Women using or considering, and anyone supporting them
    summary: >-
      The most under-served area in this entire field. What is known, what is
      assumed, and what has simply never been studied in women at all.
    illustrative: true

# ------------------------------------------------------------------ groups

groups:

  - id: open-scotland
    name: Open group — Scotland
    kind: open
    when: Tuesdays
    time: "19:30"
    duration: 90 min
    coverage: [scotland]
    facilitated_by: Two trained peer facilitators
    size: Up to 12
    cameras: optional
    who_for: >-
      Anyone at any stage — using, stopping, stopped, or just working out what
      to do. No commitment, no need to speak.
    what_happens:
      - Ten minutes of arrivals. Cameras off is completely fine.
      - A short check-in. You can pass.
      - Open floor — whatever people have brought that week.
      - A proper close, so nobody leaves mid-sentence into their evening.
    joining: One-off sign-up, then the same link every week
    illustrative: true

  - id: open-englandwales
    name: Open group — England & Wales
    kind: open
    when: Wednesdays
    time: "20:00"
    duration: 90 min
    coverage: [england, wales]
    facilitated_by: Two trained peer facilitators
    size: Up to 12
    cameras: optional
    who_for: Same format as the Scotland group, different room and different time.
    what_happens:
      - Ten minutes of arrivals. Cameras off is completely fine.
      - A short check-in. You can pass.
      - Open floor — whatever people have brought that week.
      - A proper close.
    joining: One-off sign-up, then the same link every week
    illustrative: true

  - id: open-weekend
    name: Open group — weekend, anywhere
    kind: open
    when: Saturdays
    time: "10:00"
    duration: 90 min
    coverage: [ni, ireland, other]
    facilitated_by: Two trained peer facilitators
    size: Up to 12
    cameras: optional
    who_for: >-
      Timed for people who cannot make weekday evenings — shift work, family,
      or a different time zone entirely.
    what_happens:
      - Same shape as the weekday groups, at a civilised hour.
    joining: One-off sign-up, then the same link every week
    illustrative: true

  - id: cohort-comingoff
    name: Coming off — six week cohort
    kind: cohort
    when: Mondays
    time: "20:00"
    duration: 90 min
    coverage: [scotland, england, wales, ni, ireland, other]
    facilitated_by: Two trained peer facilitators
    size: Eight people, closed
    cameras: on where possible
    who_for: >-
      People who have decided to stop, or are close to deciding. The same eight
      people for six weeks — you start together and finish together.
    what_happens:
      - "Week 1 — what brought you here, and what you are actually worried about."
      - "Week 2 — what the evidence says, and how much of it is missing."
      - "Week 3 — getting seen: who to ask, what to ask for."
      - "Week 4 — the first month off, from people who have had it."
      - "Week 5 — what to do when it is worse than you expected."
      - "Week 6 — what next, and staying connected."
    joining: Waiting list. Groups start when eight people are ready.
    illustrative: true

  - id: family-monthly
    name: Partners & family
    kind: family
    when: First Thursday of the month
    time: "19:00"
    duration: 75 min
    coverage: [scotland, england, wales, ni, ireland, other]
    facilitated_by: One trained facilitator
    size: Up to 15
    cameras: optional
    who_for: >-
      For people supporting someone who uses. He does not need to know you are
      here, and you do not need his permission to look after yourself.
    what_happens:
      - A room of people in exactly the same position.
      - Understanding what is physically happening, which usually helps more than confronting it.
      - How to raise it without it turning into a row.
    joining: Drop in, no sign-up
    illustrative: true

  - id: topic-bloods
    name: Bloods clinic — bring your panel
    kind: topic
    when: Third Sunday of the month
    time: "18:00"
    duration: 60 min
    coverage: [scotland, england, wales, ni, ireland, other]
    facilitated_by: One facilitator, clinician present where possible
    size: Up to 20
    cameras: optional
    who_for: >-
      Anyone holding a set of results they cannot read. General explanation
      only — nobody will interpret your individual results in a group.
    what_happens:
      - A walk through what each marker on a standard panel is.
      - General questions answered. Individual ones signposted.
      - You leave with a consultation brief filled in for your own appointment.
    joining: Drop in, no sign-up
    illustrative: true
