notes: >-
  LICENCE: NCBI Bookshelf content of this kind is published CC-BY-NC-ND.
  NoDerivatives means STAN may cite and quote with attribution but may NOT
  publish adapted versions of the text. This reinforces rather than conflicts
  with the Tier A rule — report and attribute, never reproduce.
  TIER 1 BACKSTOP: this is one of the sources the foundational marker fields
  should be written FROM, rather than written first and cited afterwards.
