notes: >-
  Frequently the most-cited paper in this field and correspondingly the most
  frequently over-stretched. Note both directions of misuse: by people
  minimising risk ("it's only a small difference") and by people catastrophising
  ("you can never recover"). The claims_not_supported list is deliberately
  written to block both.
