  added_on: '2026-09-01'
  discovered_via: Literature search on ASIH recovery, 2026-09-01.

notes: >-
  FLAGGED FOR CAREFUL HANDLING. A secondary summary of this review states that
  "near complete recovery of testosterone is seen over months, and complete
  gonadotropin recovery is expected over 3-6 months." That figure has NOT been
  verified against the full text and must not be quoted until it has been, and
  even then must not be presented without the exposure profile of the included
  populations attached. A reader with six years of supraphysiological exposure
  who takes "3-6 months" as applying to them is precisely the harm this register
  exists to prevent. Read the full text and record the actual population
  characteristics behind that figure before any content page cites it.
