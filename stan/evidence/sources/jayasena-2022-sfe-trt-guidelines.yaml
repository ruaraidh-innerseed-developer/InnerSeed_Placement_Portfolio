notes: >-
  This is the anchor guideline for the first planned content page (high SHBG,
  low free testosterone, inadequate transdermal replacement). Note the tension
  worth stating openly on that page: the guideline provides the biochemical
  reasoning but does not address the post-AAS population, so the page must be
  explicit that it is applying general guidance to a population the guidance
  does not name. Lead author Jayasena is also the priority outreach contact.
