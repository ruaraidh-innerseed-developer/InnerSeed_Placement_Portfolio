id: taylor-2002-anabolic-steroids-athlete
type: textbook
title: >-
  Anabolic Steroids and the Athlete, 2nd edition
authors:
  - Taylor WN
year: 2002
venue: McFarland & Company, Jefferson NC
identifiers:
  isbn: '9780786411283'
  url: https://mcfarlandbooks.com/product/anabolic-steroids-and-the-athlete-2d-ed/
open_access: false

evidence_level:
  scheme: STAN-EL-1
  grade: C
  rationale: >-
    A referenced monograph by a physician, not primary research, and twenty-four
    years old. Its grade splits by what it is asked to carry. For DESCRIBING
    what anabolic steroid users actually did and why — the regimens, the
    reasoning, the sequence of escalation — it is a good secondary source: the
    author separates "the anabolic steroid user's regime" from "the science
    behind the regime" in every section, which is the same distinction STAN
    makes. For CURRENT clinical fact it carries almost no weight; the
    cardiovascular and ASIH-recovery literature has moved substantially since
    2002 and anything it says about the state of evidence must be re-checked
    against current sources before it is repeated.

population_relevance:
  rating: direct
  notes: >-
    The subject is non-medical anabolic steroid use by athletes and
    bodybuilders, which is STAN's population. The caveat is era, not people:
    these are users of the 1980s and 1990s, before widespread internet
    sourcing, before the current UK image-and-performance-enhancing-drug
    picture, and before SARMs and peptides were in common use. Treat every
    behavioural description as "how it was", and check whether it still holds.

topics:
  - harm-reduction
  - mental-health
  - pct-restart
  - asih
  - epidemiology

claims_supported:
  - >-
    Descriptive account of anabolic steroid user regimens as they stood around
    2002 — first cycle through fifth cycle, stacking, pyramiding, cycling — and
    the reasoning users gave for them.
  - >-
    That users obtain their information from other users rather than from
    clinicians, and that a documented informational gap exists between the
    user community and the scientific community. The author states this
    explicitly as the reason for writing the chapter.
  - >-
    Statements about where scientific evidence was ABSENT as at 2002 — for
    instance for the rest phase between cycles. These are citable as a
    historical position, and as a prompt to check whether the gap has since
    been filled. They are not citable as the current state of evidence.
  - >-
    As a bibliography. The chapter's numbered references point to the primary
    literature STAN actually wants, and chasing them is the point of holding
    this record.

claims_not_supported:
  - >-
    Any dosing, cycle length, stacking or tapering guidance. The book describes
    these practices and explicitly disclaims endorsement of them; STAN does not
    publish them at all, per SCOPE.md. Claims extracted from these passages
    exist so STAN can UNDERSTAND and DISCUSS user practice, never to instruct.
  - >-
    Any current statement of cardiovascular risk. The 2002 position is
    superseded and repeating it would understate what is now known.
  - >-
    Any statement about recovery of the hypothalamic-pituitary-gonadal axis,
    fertility, or ASIH management as current clinical fact. Use Grant 2023,
    Solanki 2023 and the current literature.
  - >-
    Any claim that a practice is safe or effective because the book reports
    that users believe it is. The book is reporting a belief, not endorsing it,
    and STAN must preserve that distinction in every sentence it writes.
  - >-
    Anything outside Chapter 5. The rest of the book has not been read.

limitations: >-
  Secondary source. Twenty-four years old, which matters most for anything
  clinical. Single-author synthesis, so selection of evidence is the author's.
  Behavioural descriptions are not from a systematic ethnography and are not
  quantified — "most first-time users" is the author's characterisation, not a
  measured proportion. Only Chapter 5 has been read. STAN's copy is a physical
  paperback, so quotes are transcribed from photographs and none has yet been
  verified character by character against the page.

conflicts_of_interest: >-
  Not stated in the pages read. The author is a physician who has written
  extensively on this subject and has been a public advocate for drug testing
  in sport, which is a standpoint worth recording even though it is not a
  financial interest. The declaration pages have not been read.

verification:
  bibliographic: verified
  full_text_read: true
  read_scope: >-
    Chapter 5, "Anabolic Steroid Regimes Used by Athletes", pages 60-64 only.
