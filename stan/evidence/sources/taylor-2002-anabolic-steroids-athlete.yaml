notes: >-
  FIRST SOURCE TO PRODUCE CLAIMS. Ten claims extracted, all at status draft with
  quote_verified false.

  Two jobs for the founder, in order. First, verify the ten quotes against pages
  60-62 — read each quote against the page and set quote_verified true, or
  correct it. They were transcribed from photographs taken at an angle and one
  or two line-break joins are the likely errors. Second, and worth more,
  photograph the endnotes for Chapter 5: references 1-26 are the primary
  literature this chapter rests on, and they are listed in
  evidence/reference-chase/taylor-2002-chapter-5.md waiting to be filled in.

  On why this book earns its place despite its age: its structure is the one
  STAN is trying to build. Every section states what users do, then states
  separately what the science does and does not support, and says plainly when
  the answer is "unproven". That is the translator role, executed in print, in
  2002. Read it as a model as well as a source.
