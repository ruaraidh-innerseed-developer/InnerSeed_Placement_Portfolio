id: heavy-users-describe-it-as-having-no-end-in-sight
statement: Many long-term heavy users reach a point of recognising their situation
  as a physical and psychological problem they cannot see a way out of.
source: taylor-2002-anabolic-steroids-athlete
locator: Ch. 5, p. 64, 'Beyond the Fifth Cycle', closing paragraph
quote: Heavy users experience physiological and psychological consequences. Many
  begin to realize their experimentation has become a biochemical and psychological
  nightmare with no end in sight.
quote_verified: false
kind: direct
population: Heavy long-term anabolic steroid users, as characterised by the author
  around 2002. The author's characterisation, not a measured or diagnostic finding.
does_not_support:
- A clinical diagnosis of any kind.
- A claim that there is in fact no way out. The passage reports how it feels to
  the person, not a prognosis, and STAN must never let a description of despair
  read as a confirmation of it.
- Any quantification of how many reach this point.
topics:
- mental-health
- harm-reduction
- asih
extracted_by: Claude (Opus 5), from the founder's photograph of p. 64
extracted_on: '2026-09-05'
status: draft
notes: 'HANDLE WITH CARE. This describes hopelessness, and the reader most likely
  to find it is the person feeling it. It must never appear without a route onward
  and the crisis numbers. Its value is recognition: somebody wrote this down, so
  the experience is known and ordinary rather than a personal failure.'
