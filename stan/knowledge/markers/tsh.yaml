what_it_is: >-
  Thyroid stimulating hormone — the brain's instruction to the thyroid
  gland. It appears on hormone panels partly because thyroid problems move
  SHBG, which changes how a testosterone result reads.
made_where: >-
  The anterior pituitary gland.
controlled_by: >-
  TRH from the hypothalamus, and negative feedback from the thyroid
  hormones themselves. It moves in the opposite direction to thyroid
  output: a high TSH usually means an underactive thyroid.
functions:
  - >-
    Tells the thyroid to produce thyroid hormone, which sets the body's
    metabolic rate.
  - >-
    Acts as the most sensitive first-line indicator of thyroid function.
female_note: >-
  Thyroid disorders are considerably more common in women, and thyroid
  function changes in pregnancy.

