what_it_is: >-
  Luteinising hormone. In men it is the brain's instruction to the
  testicles to make testosterone. Read alongside testosterone, it tells
  you whether a problem sits at the brain end or the testicle end.
made_where: >-
  The anterior pituitary gland, at the base of the brain.
controlled_by: >-
  Pulses of GnRH from the hypothalamus, released roughly every couple of
  hours. The pulsing matters — a steady stream does not work. Testosterone
  and oestradiol both feed back to reduce it.
functions:
  - >-
    Tells the Leydig cells in the testicles to produce testosterone.
  - >-
    Maintains the very high testosterone concentration inside the testicle
    that sperm production depends on.
  - >-
    In women, a mid-cycle surge triggers ovulation.
female_note: >-
  In women LH works across the menstrual cycle and surges to trigger
  ovulation, so a result cannot be interpreted without knowing which day
  of the cycle the sample was taken. After menopause it rises.

