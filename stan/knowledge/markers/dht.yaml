what_it_is: >-
  Dihydrotestosterone — a more potent androgen made from testosterone. It
  binds the androgen receptor more strongly than testosterone does, and
  acts mainly in skin, hair and prostate.
made_where: >-
  Converted from testosterone by an enzyme called 5-alpha-reductase, in
  the skin, hair follicles, prostate and liver rather than in the
  testicle.
controlled_by: >-
  How much testosterone is available, and how active 5-alpha-reductase is
  in a given tissue. Medicines such as finasteride and dutasteride work by
  blocking that enzyme.
functions:
  - >-
    Drives prostate growth.
  - >-
    Produces body and facial hair.
  - >-
    Causes scalp hair loss in people genetically susceptible to it.
  - >-
    Responsible for genital development before birth and at puberty.
  - >-
    Contributes to libido.
female_note: >-
  Women produce DHT too. It contributes to unwanted hair growth and to
  androgenic hair thinning where androgen levels are raised.

