what_it_is: >-
  The most abundant protein in your blood. It binds testosterone loosely —
  loosely enough that testosterone attached to albumin is generally
  counted as available to the body, unlike testosterone bound to SHBG.
made_where: >-
  The liver.
controlled_by: >-
  Liver function, nutrition, inflammation and hydration. It falls in liver
  disease, in malnutrition and during significant illness.
functions:
  - >-
    Carries hormones, drugs and fatty acids around the bloodstream.
  - >-
    Holds fluid inside blood vessels rather than letting it leak into
    tissue.
  - >-
    Is the third figure a calculated free testosterone needs, alongside
    total testosterone and SHBG.
  - >-
    Serves as a general indicator of liver function and nutritional state.
female_note: >-
  No material difference between men and women.

