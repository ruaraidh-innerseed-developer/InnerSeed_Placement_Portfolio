what_it_is: >-
  Anti-Müllerian hormone. In women it is the standard measure of how many
  eggs remain. In men it is made by the same testicular cells that support
  sperm production.
made_where: >-
  Sertoli cells in the testicles. In women, the granulosa cells of small
  developing follicles.
controlled_by: >-
  In males it is high in childhood and falls at puberty as testosterone
  concentration inside the testicle rises. In women it reflects the size
  of the remaining pool of small follicles and declines with age.
functions:
  - >-
    Before birth, prevents female reproductive structures forming in a
    male fetus.
  - >-
    After birth, serves mainly as a marker of gonadal cell activity rather
    than as a working hormone.
female_note: >-
  The usual test for ovarian reserve. Unlike FSH it can be measured on any
  day of the cycle, which is part of why it is used so widely.

