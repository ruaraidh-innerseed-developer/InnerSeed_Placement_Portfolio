what_it_is: >-
  Follicle-stimulating hormone. In men it is the brain's instruction for
  sperm production; in women it drives the development of eggs.
made_where: >-
  The anterior pituitary gland, alongside LH.
controlled_by: >-
  GnRH pulses from the hypothalamus. Inhibin B, made by the same
  testicular cells FSH acts on, feeds back to suppress FSH specifically.
  Oestradiol and testosterone also reduce it.
functions:
  - >-
    Supports the Sertoli cells in the testicles, which sustain sperm
    production.
  - >-
    Prompts those cells to release inhibin B, closing its own feedback
    loop.
  - >-
    In women, drives the growth of ovarian follicles each cycle.
female_note: >-
  Cycle-day dependent, and usually measured early in the cycle. It rises
  markedly around and after menopause, which is what makes it useful as a
  marker of ovarian reserve.

