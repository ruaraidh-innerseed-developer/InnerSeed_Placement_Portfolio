what_it_is: >-
  A pituitary hormone best known for milk production, but active in both
  sexes. When it is raised it interferes with the testosterone loop, which
  is why it appears on male hormone panels.
made_where: >-
  The anterior pituitary gland.
controlled_by: >-
  Unusually, it is held down rather than switched on: dopamine from the
  hypothalamus continuously suppresses it. Anything that reduces dopamine
  signalling — including some medicines — allows it to rise.
functions:
  - >-
    Drives milk production after childbirth.
  - >-
    Influences libido and sexual function in both sexes.
  - >-
    When persistently high, suppresses GnRH and therefore LH and FSH,
    which lowers testosterone.
female_note: >-
  Rises normally in pregnancy and while breastfeeding. Outside those
  situations a raised level is investigated the same way as in men.

