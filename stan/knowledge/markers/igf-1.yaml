what_it_is: >-
  Insulin-like growth factor 1 — the hormone through which most of growth
  hormone's effects are actually delivered. It is usually measured instead
  of growth hormone itself, because growth hormone is released in bursts
  and a single reading of it means very little.
made_where: >-
  Mostly the liver, in response to growth hormone. Smaller amounts are
  produced in other tissues.
controlled_by: >-
  Growth hormone from the pituitary. Also nutrition, insulin and liver
  function — undernutrition and liver disease both lower it regardless of
  how much growth hormone is present.
functions:
  - >-
    Drives tissue growth and repair.
  - >-
    Builds muscle and bone.
  - >-
    Affects how the body handles glucose and fat.
female_note: >-
  No major difference in what it does. Levels fall with age in both sexes.

